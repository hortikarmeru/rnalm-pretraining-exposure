# All paths, thresholds, and settings. Scripts read from here; no hard-coded numbers.
# Empty values are not set yet; a comment gives the planned value where there is one.

paths:
  data_dir: data
  results_dir: results
  raw_dir: data/raw
  processed_dir: data/processed
  rnacentral_fasta: "{raw_dir}/rnacentral/{release}/{file}"
  corpus_fasta: "{processed_dir}/corpora/{name}.fasta"   # script 11: merged, length-filtered, exact-deduplicated corpora
  test_sets: "{processed_dir}/test_sets.jsonl"   # script 12: filtered, deduplicated test sequences with reference pairs
  scores_dir: "{processed_dir}/scores"   # script 18: score maps of the frozen heads, for rescoring without the GPU
  exposure_dir: "{processed_dir}/exposure"   # script 13: MMseqs2 databases and hit tables, one folder per corpus
  rnacentral_dedup: "{processed_dir}/rnacentral_cdhit100/{name}"   # + .fasta (script 05; script 02 also writes .fasta.clstr)
  manifests:
    rnacentral: data_manifests/rnacentral.tsv
    downloads: data_manifests/downloads.tsv   # test and validation sets, Rfam, RNA3DB, RefSeq catalog (script 07)
  frozen_heads: results/frozen_heads.json   # committed before any test scoring

models:
  rna_fm:
    checkpoint:
    max_input_length: 1022   # nucleotides (1024 tokens with BOS/EOS); longer test sequences are dropped
    n_layers: 12
    n_heads: 20
  rinalmo:
    sizes: # micro, mega, giga
    checkpoints:
      micro:
      mega:
      giga:
    n_layers:   # Penić et al. 2025, Supplementary Table 1
      micro: 12
      mega: 30
      giga: 33
    n_heads:
      micro: 20
      mega: 20
      giga: 20
    use_flash_attn: false   # FlashAttention does not return usable attention probabilities
  rna_msm:
    checkpoint:
    mode: # single-sequence
    training_rfam_version: "14.7"
    n_layers: 10
    n_heads: 12
  dna_lm:   # floor, reported descriptively: no RNA-specific pretraining (genomes still contain the RNA genes), so not zero exposure
    name: aido_dna_300m
    checkpoint: genbio-ai/AIDO.DNA-300M   # BERT-style encoder, one token per nucleotide, 24 layers x 16 heads, 796 species
    head_selection_subset: pool   # no RNA corpus, so no exposure split: its head is chosen on the whole selection pool

download:
  aria2c_options: ["-c", "-j3", "-x16", "-s16", "-k1M", "--file-allocation=none", "--summary-interval=300", "--console-log-level=warn"]

inference:
  device: cuda
  batch_size: 1          # one sequence per pass: no padding in the attention maps (as in Wang et al. 2026)
  dtype: float16_autocast  # torch.cuda.amp.autocast, as in Wang et al. 2026
  implementations:   # scripts 08 and 09 run one implementation per call, each in its own conda env (their transformers versions conflict)
    multimolecule:     # Hugging Face ports (multimolecule, transformers 5); env rnalm-infer
      rna_fm: multimolecule/rnafm
      rinalmo_micro: multimolecule/rinalmo-micro
      rinalmo_mega: multimolecule/rinalmo-mega
      rinalmo_giga: multimolecule/rinalmo-giga
      rna_msm: multimolecule/rnamsm
    genbio:            # GB.RNA, formerly AIDO.RNA: the authors' model code from modelgenerator (pins transformers 4.38); env rnalm-aido
      aido_rna_650m: genbio-ai/GB.RNA-650M
      aido_rna_1.6b: genbio-ai/GB.RNA-1.6B
      aido_dna_300m: genbio-ai/AIDO.DNA-300M   # DNA floor (models.dna_lm); given T for U like GB.RNA, since its genomic training data has no U
  memory_check:   # script 08: one random sequence at the input limit, all attention maps
    seed: 0

test_sets:
  sets:   # copies closest to the source; files from data_manifests/downloads.tsv, under raw_dir; sequence ID = <set>:<file stem>
    archiveii:       # original ArchiveII (Mathews lab tarball, 3,975 .ct); MXfold2's copy lacks 9 full-length 16S/23S rRNAs (all > 1022 nt), otherwise the same
      archive: archiveii/archiveII.tar.gz
      members: "archiveII/*.ct"
      format: ct
    bprna_ts0:       # SPOT-RNA's original TS0 (1,305 .st, pseudoknots and non-canonical pairs kept); MXfold2's copy strips both
      archive: spotrna/bpRNA_dataset.zip
      members: "bpRNA_dataset/TS0/*.st"
      format: bprna_st
    bprna_new:       # only distributed copy: MXfold2 (5,401 .bpseq, canonical nested pairs); [!.] skips macOS "._" files
      archive: mxfold2/mxfold2-data.tar.gz
      members: "data/bpRNAnew_dataset/bpRNAnew.nr500.canonicals/[!.]*.bpseq"
      format: bpseq
    archive_nofam:   # Szikszai et al. 2026 supplement, media-5.zip (89 PDB chains, .ct; file stem = <pdb>_<chain>)
      archive: szikszai2026/supplementary_files.zip
      inner_archive: media-5.zip
      members: "supplemental-file-2/ground-truth/*.ct"
      format: ct
  # Settings below apply to the test sets only; the selection set keeps Wang et al. 2026's sequences as given (2 VL1 sequences contain X/N).
  length_cutoff: models.rna_fm.max_input_length   # longer sequences dropped (25 in ArchiveII)
  non_acgu: drop             # any letter other than ACGU after uppercase + T->U (17 in TS0, 13 in bpRNA-new)
  no_reference_pairs: drop   # F1 is 0 whatever the prediction (4 in ArchiveII)
  reference_pairs: all       # every pair the set provides counts, incl. pseudoknots and non-canonical (as in Wang et al. 2026)
  duplicates:                # exact sequence after uppercase + T->U; one row per sequence
    within_set: keep_first_if_structures_agree   # first by file name; if copies' structures differ, drop all copies (24 in ArchiveII, 2 in Archive-NoFam)
    across_sets: [archiveii, bprna_ts0, bprna_new, archive_nofam]   # priority order: a shared sequence stays in the first set, with that set's structure (103 ArchiveII/TS0; 47 of them annotated differently)

validation:
  selection_set: wang2026_vl1        # 40 PDB structures (Zhang et al. 2024), Wang et al. 2026 Zenodo 18218776; Wang's head-selection set, used as such in the reproduction (script 09)
  reproduction_set: wang2026_ts      # 70 PDB structures; targets: Wang et al. 2026, Supplementary Table 4
  head_selection_sets: [wang2026_vl1, wang2026_ts]   # our frozen heads are chosen on both, pooled (96 after overlap removal): the reproduction is finished, and a median split of VL1 alone would leave ~19 structures per model
  wang2026_zip: "{raw_dir}/wang2026/bib.zip"
  wang2026_files:   # inside the zip: lists of (PDB chain, sequence, contact matrix, indices of residues with structure)
    wang2026_vl1: bib/Task_ss/data/vl_40_key_seq_contact_idx.pkl
    wang2026_ts: bib/Task_ss/data/ts_70_key_seq_contact_idx.pkl
  reproduction_targets:   # TS, Wang et al. 2026 Supplementary Table 4: median F1, mean F1, median MCC
    rna_fm: {median_f1: 0.180, mean_f1: 0.267, median_mcc: 0.186}
    rinalmo_micro: {median_f1: 0.256, mean_f1: 0.268, median_mcc: 0.268}
    rinalmo_mega: {median_f1: 0.315, mean_f1: 0.342, median_mcc: 0.317}
    rinalmo_giga: {median_f1: 0.404, mean_f1: 0.414, median_mcc: 0.416}
    rna_msm: {median_f1: 0.631, mean_f1: 0.582, median_mcc: 0.634}   # with MSAs; not comparable to single-sequence mode
    aido_rna_650m: {median_f1: 0.438, mean_f1: 0.402, median_mcc: 0.469}
    aido_rna_1.6b: {median_f1: 0.579, mean_f1: 0.508, median_mcc: 0.595}
  exclude_test_overlap: [exact_sequence, pdb_chain]   # selection-set sequences identical to a test sequence (after uppercase + T->U), or the same PDB chain as an Archive-NoFam entry, are removed (3 from VL1: 6DTD_C, 6AAY_B, 6XMF_C; 11 from TS: 10 identical, 6SY4_C same chain); near-identical ones flagged by the homolog search
  exposure_corpus:   # the corpus each model's exposure comes from (script 13)
    rna_fm: rna_fm
    rinalmo_micro: rinalmo
    rinalmo_mega: rinalmo
    rinalmo_giga: rinalmo
    aido_rna_650m: aido_rna
    aido_rna_1.6b: aido_rna
  low_exposure: at_or_below_median   # per model: head-selection sequences with log_homologs <= that model's median over the pooled sets

corpora:
  rna_fm:
    source: # archived RNAcentral release matched to RNA-FM's corpus: ~27M records from 47 databases, 23,735,169 after CD-HIT-EST at 100% (Shen et al. 2024, RhoFold+); no release is stated
    release: # not chosen yet: 19.0 (active) matches best after 100% dedup and by length statistics (results/05_dedup_*.json, results/06_*); 18.0 is next and has 47 databases; waiting for the RNA-FM authors' reply
    expected_records: # ~27,000,000 ("around 27 million"; no exact count published)
    expected_after_dedup: # 23,735,169 (Shen et al. 2024, Fig. 1)
    reference_fingerprint:   # RNA-FM's corpus as described in Shen et al. 2024 (RhoFold+), Supplementary Information; compared by script 06
      sequences: 23735169
      min_length: 11
      q1: 253
      median: 438
      q3: 784
      max_length: 347561
      mean_length: 634.0
      under_1023: 18752615
      letters: {X: 672, I: 11, F: 3, O: 1, P: 1}
    candidates:   # counted (script 01) and deduplicated (script 05) to choose the release; 15.0 fits ~27M records, 17.0 and 18.0 fit "47 databases"
      - {name: "15.0_active", release: "15.0", files: [rnacentral_active.fasta.gz]}
      - {name: "15.0_active_inactive", release: "15.0", files: [rnacentral_active.fasta.gz, rnacentral_inactive.fasta.gz]}
      - {name: "15.0_species_specific", release: "15.0", files: [rnacentral_species_specific_ids.fasta.gz]}
      - {name: "17.0_active", release: "17.0", files: [rnacentral_active.fasta.gz]}
      - {name: "18.0_active", release: "18.0", files: [rnacentral_active.fasta.gz]}
      # the releases right after the candidates above, counted and deduplicated the same way to pick next_release
      - {name: "16.0_active_inactive", release: "16.0", files: [rnacentral_active.fasta.gz, rnacentral_inactive.fasta.gz]}
      - {name: "19.0_active", release: "19.0", files: [rnacentral_active.fasta.gz]}
    fasta:
  rinalmo:
    sources: # RNAcentral + Rfam + RefSeq ncRNA from nt (approximation; Ensembl 109 not added)
    rnacentral_release: "22.0"   # Penić et al. 2025 (Nature Communications), data availability
    rfam_release: "14.9"         # confirmed, same source
    refseq_release: 216          # nt ncRNA stand-in: archived catalog, Mar 2023, first release after Ensembl 109
    refseq_prefixes: [NR_, XR_]  # nt ncRNA per the authors
    rfam_fasta_url: https://ftp.ebi.ac.uk/pub/databases/Rfam/14.9/fasta_files/   # one FASTA per family (script 10)
    rfam_dest: rfam/14.9/fasta_files          # under raw_dir
    refseq_catalog: refseq/216/RefSeq-release216.catalog.gz   # under raw_dir (script 07)
    refseq_dest: refseq/216/ncrna             # under raw_dir: efetch batches (script 10)
    refseq_efetch:               # NCBI keeps no FASTA of old releases; the catalog's accession.versions are fetched
      url: https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi
      tool: rnalm-exposure
      batch_size: 500
      min_interval_s: 0.34       # NCBI limit without an API key: 3 requests per second
      retries: 8
      retry_wait_s: 30
    min_length: 16               # RiNALMo Methods 4.3; kept: 16 <= length <= 8192
    max_length: 8192
    dedup: exact                 # seqkit rmdup -s, as in RiNALMo
    build_sources:               # script 11, under raw_dir; Ensembl 109 not added
      - rnacentral/22.0/rnacentral_active.fasta.gz
      - rfam/14.9/fasta_files/RF*.fa.gz
      - refseq/216/ncrna/batch_*.fa
    clusters:                    # rebuilt to approximate RiNALMo's per-cluster sampling
      tool: mmseqs2 easy-linclust
      min_seq_id: 0.7
      coverage: 0.8              # -c 0.8
    fasta:
  aido_rna:   # AIDO.RNA (GB.RNA) 650M and 1.6B: "42 million unique ncRNA sequences from RNAcentral version 24.0" (GB.RNA-1.6B model card)
    release: "24.0"              # active + inactive: 41,560,889 distinct after uppercase + T->U (active alone: 32.3M)
    dedup: exact                 # SeqKit dedup per the AIDO.RNA paper
    build_sources:               # script 11, under raw_dir; no length filter stated
      - rnacentral/24.0/rnacentral_active.fasta.gz
      - rnacentral/24.0/rnacentral_inactive.fasta.gz
  dedup: # cd-hit-est, as in RNA-FM's methods; run only by scripts 02 and 04 to check dedup_containment, which the corpora are deduplicated with
    tool: cd-hit-est
    identity: 1.0          # -c 1.0, as in RNA-FM's methods
    both_strands: true     # -r 1 (cd-hit-est default)
    run_on_dna_alphabet: true  # convert T->U after clustering
    memory_mb: 0           # -M 0 = no memory cap
    threads: 16            # -T; PC (Ryzen 7 7700X, 16 threads)
    other_options: ["-d", "0"]   # -d 0: keep full FASTA headers in the output
  dedup_containment:   # 100% dedup of the RNA-FM snapshot, next_release and post_snapshot (script 05): exact containment on both strands, the rule of cd-hit-est -c 1.0 -r 1, in minutes instead of weeks
    min_length: 10       # cd-hit-est -l default: sequences of <= 10 nt are dropped before clustering
    short_anchor: 11     # seed for sequences shorter than long_anchor (= min_length + 1)
    long_anchor: 27      # 27 letters in base 5 (A, C, G, T, N) fit in 64 bits
    threads: 16
  dedup_check:   # containment vs real cd-hit-est on subsets of one candidate
    candidate: 15.0_active_inactive
    random_size: 300000    # uniform sample of records
    dense_size: 30000      # sample of records containing dense_motif: many near-identical sequences
    dense_motif: GTGCCAGCAGCCGCGGTAA   # 16S rRNA 515F primer site
    seed: 0
  dedup_estimate:   # sampling estimate of the 100% cluster count (script 03); superseded by the exact counts from script 05
    sample_size: 20000      # records per candidate; SE of the estimate ~0.2% of the corpus
    anchor_length: 24       # prefix of each sampled sequence used to find candidate containers
    seed: 0
  next_release: # robustness check, RNA-FM only (RiNALMo's and AIDO.RNA's releases are known): the runner-up candidate for C1, e.g. 18.0 if 19.0 is chosen
    release:   # set with corpora.rna_fm.release
    fasta:
  post_snapshot: # placebo: homologs added after every model's snapshot
    release: "28.0"              # 2026-10-07, 61.0M records
    exclude_releases:            # drop sequences found here (exact, after uppercase + T->U)
      - rna_fm_snapshot          # corpora.rna_fm.release
      - "22.0"                   # RiNALMo corpus
      - "24.0"                   # last release before RiNALMo micro/mega weights (Mar 2025)
    exclusion_match: exact
    dedup: containment           # corpora.dedup_containment, applied after exclusion
    fasta:

sequences:
  uppercase: true
  t_to_u: true

homolog_search:
  tool: mmseqs2
  min_identity: 0.80
  min_coverage: 0.80       # of the test sequence's length
  coverage_mode: 2         # --cov-mode 2: coverage of the query
  seq_id_mode: 0           # --seq-id-mode 0: identity over the alignment; mode 1 as a robustness variant
  search_type: 3           # nucleotide
  kmer_length: 15          # -k; nucleotide prefiltering uses exact k-mer seeds
  sensitivity: 7.5         # -s; recorded, but it has no effect on nucleotide prefiltering
  evalue: 10               # -e; hits are defined by identity and coverage, the default 0.001 drops short exact matches
  max_target_seqs: 1000000 # --max-seqs; queries that reach it are rerun with a higher cap (tRNA/rRNA have 100k+ homologs)
  strand: forward          # --strand 1: the models only saw sequences as written
  count: unique_targets
  threads: 16
  log_offset: 1            # log(1 + count)
  log_base: e              # slopes also reported per 10x (times ln 10)
  sequence_overlap: 1022   # --sequence-overlap: MMseqs2 cuts targets over 10,000 nt into pieces; overlapping them by the longest query keeps every match whole in one piece

exposure_checks:
  exact_match: containment     # test sequence contained in a corpus sequence (forward strand); the corpora are deduplicated by containment
  max_identity: coverage_0.8   # best identity among hits covering >= 80% of the query (search with --min-seq-id 0)
  log_same_family_count: rnacentral_rfam_annotations   # RNAcentral's precomputed Rfam hits, families present in both Rfam versions
  log_cluster_count:   # RiNALMo only: distinct RiNALMo-corpus clusters among homologs, log(1 + n)

family_assignment:
  rfam_release: "15.0"     # as used by RNA3DB releases since 2024-12-04 (Archive-NoFam's release)
  rfam_cm: rfam/15.0/Rfam.cm.gz         # under raw_dir (data_manifests/downloads.tsv)
  rfam_clanin: rfam/15.0/Rfam.clanin    # for the check assignment
  infernal_version: "1.1.4"
  cmscan_evalue: 1.0       # RNA3DB's rule: default cmscan (both strands), hits with E <= 1
  cmscan_options: []
  rescan_options: ["--max"]   # RNA3DB's second scan (scripts/get_nohits.py): sequences with no hit at all, or with no hit at E <= 1 and shorter than rescan_below_length
  rescan_below_length: 64
  family_per_sequence: lowest_evalue   # RNA3DB's top_hits (first on ties); RNA3DB's own grouping uses connected components over all hits instead
  no_hit: own_group        # each sequence without a family is its own group
  check_options: ["--cut_ga", "--rfam", "--nohmmonly", "--fmt", "2", "--clanin"]   # gathering-threshold assignment as a check
  rna3db_components:       # kept for reporting; not the grouping variable

vienna:
  rnafold_options: []     # defaults: Turner 2004 parameters, -d2, MFE, no --noLP
  temperature: 37

readout:   # follows Wang et al. 2026 (paper and released code)
  symmetrize: sum          # A + A^T
  apc: true                # on the full map incl. BOS/EOS, which are dropped afterwards
  apc_before_dropping_special_tokens: true
  sigmoid: true
  layer_grid: all
  head_grid: all
  threshold_grid: [0.0, 1.0, 0.001]   # one threshold per head, chosen with the head
  selection_metric: pooled_f1   # tp/fp/fn summed over all selection sequences; ties: lowest layer, then lowest head
  min_loop_length: 0       # any j > i
  one_pair_per_base: false # primary readout, as in Wang et al. 2026
  canonical_only: false
  f1_matching: exact       # no +-1 shift
  variants:                # each with its own head and threshold frozen on the selection set
    one_pair_per_base: greedy_by_score   # sensitivity readout: each base keeps at most one partner
    apc_off: no_apc                      # APC-off check: symmetrize and sigmoid only; own head and threshold, since the primary threshold is tuned on APC-corrected scores

analysis:
  formula: f1 ~ log_homologs + vienna_f1 + log_length + dataset + (1 + log_homologs | family)   # four test sets pooled, dataset as a fixed effect
  rinalmo_joint_formula: f1 ~ log_homologs * size + vienna_f1 + log_length + dataset + (1 + log_homologs | family) + (1 | seq_id)   # also used for the AIDO.RNA replication
  sensitivity_no_dataset_term: true   # refit without dataset
  sensitivity_dataset_slopes: true    # adds dataset x log_homologs: reference conventions differ by set (D4)
  grouping: rfam_family    # RNA3DB components are too coarse (one component holds most ArchiveII families)
  software: lme4_lmerTest
  reml: true
  slope_test: satterthwaite   # within-family permutation reported alongside
  size_test: two_sided     # exposure x size: the literature points both ways
  size_term: log10_parameters_centered   # 1 df; 3 categories as a check
  joint_models:            # models fitted together with a size term
    rinalmo: [rinalmo_micro, rinalmo_mega, rinalmo_giga]
    aido_rna: [aido_rna_650m, aido_rna_1.6b]
  parameters:              # counted from the loaded checkpoints (results/08_model_memory_*.json)
    rinalmo_micro: 33482412
    rinalmo_mega: 148045430
    rinalmo_giga: 650878731
    aido_rna_650m: 646730112
    aido_rna_1.6b: 1607393280
  simulation:              # end-to-end test of the analysis on simulated F1 (real covariates), before any test scoring
    intercept: 0.3
    exposure_slope: 0.02   # true log_homologs slope used to generate F1
    vienna_slope: 0.4
    family_sd: 0.1         # random intercept by family
    family_slope_sd: 0.01  # random log_homologs slope by family
    sequence_sd: 0.05      # shared by all sizes of one model family (the joint model's seq_id term)
    residual_sd: 0.15
  scaling: center          # log_homologs centred (kept in log units); vienna_f1, log_length, size centred
  optimizer: bobyqa
  fallback: [full, uncorrelated, random_intercept]   # report the step each model reached; the exposure slope is dropped last
  sensitivity_joint_slopes: true   # adds by-family slopes for size and log_homologs x size
  sensitivity_min_length: [50, 40]   # refits without test sequences shorter than this: the search's 15-mer seeds and E-value cutoff find fewer distant homologs of short sequences

checks:
  permutation:
    n_permutations: 999    # p = (k + 1) / (n + 1) (Phipson and Smyth 2010), floor 0.001; also for the two joint models
    within: family         # singleton families and no-hit sequences never move; counted in Methods
    statistic: t           # the exposure slope's t value
    sides: two             # matches the Satterthwaite test
    convergence: keep_and_count   # refits with convergence warnings are kept and counted
    seed: 2026
  next_release:
    enabled: true
  apc_off:
    enabled: true          # uses the frozen apc_off readout (readout.variants)
  placebo: # only interpreted below this correlation; |r| > 0.7 collinearity threshold (Dormann et al. 2013)
    enabled: true
    max_correlation_with_exposure: 0.7   # |Pearson r| of log(1 + count) values, per corpus; above this the placebo is not interpreted
  masked_recovery: # optional; deferred (needs matched post-snapshot sequences, and 96% of test sequences are verbatim in the corpora)
    enabled: false
    mask_fraction:
    n_sequences:

random_seed: 2026   # for everything run from 2026-11-09 on; earlier scripts keep the seeds they ran with
