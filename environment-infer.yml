# Inference environment for RNA-FM and RiNALMo (multimolecule ports): every script run with the
# multimolecule implementation. Linux, CUDA 12.1 GPU. Then: pip install --no-deps -e .
name: rnalm-infer
channels:
  - defaults
dependencies:
  - python=3.10.20
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu121
      - torch==2.5.1+cu121
      - transformers==5.12.1
      - tokenizers==0.22.2
      - huggingface-hub==1.20.0
      - safetensors==0.8.0
      - git+https://github.com/DLS5-Omics/multimolecule@f46a10b1ff767630f20ae7c1f77f4d5ba4c9d00d
      - numpy==2.2.6
      - pandas==2.3.3
      - scipy==1.15.3
      - pyyaml==6.0.3
      - pytest==9.2.0
