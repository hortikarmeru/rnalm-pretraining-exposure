# Mac environment: sequence searches, Infernal, ViennaRNA, statistics.
# The Windows PC (model inference) needs PyTorch with CUDA plus the model
# packages; see the "inference" notes at the bottom.
name: rnalm-exposure
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11

  # Bioinformatics tools
  - infernal          # cmscan against Rfam -> family / RNA3DB component assignment
  - viennarna         # RNAfold baseline (vienna_f1 covariate)
  - mmseqs2           # homolog search of test sequences against pretraining corpora
  - seqkit            # FASTA wrangling, exact dedup
  - cd-hit            # cd-hit-est, used only to check the exact containment dedup (scripts 02 and 04)
  - aria2             # parallel downloads of RNAcentral releases

  # Core Python
  - numpy
  - numba             # compiled loops for the exact 100% dedup (containment.py)
  - pandas
  - scipy
  - pyyaml
  - biopython
  - pyarrow           # parquet for per-sequence result tables
  - tqdm

  # Statistics
  - statsmodels       # MixedLM
  - r-base
  - r-lme4            # crossed random effects: (1 + x | component) + (1 | seq_id)
  - r-lmertest
  - rpy2              # call lme4 from Python if wanted

  # Plots / notebooks
  - matplotlib
  - seaborn
  - jupyterlab

  - pytest
  - pyahocorasick     # fast substring search for the dedup estimate

  - pip
  - pip:
      - -e .            # this repo's package (src/rnalm_exposure)

# Inference (Windows PC, RTX 4070) -- install separately there:
#   conda install pytorch pytorch-cuda=12.1 -c pytorch -c nvidia
#   pip install rna-fm                  # RNA-FM
#   pip install git+https://github.com/lbcb-sci/RiNALMo   # RiNALMo
#   RNA-MSM and the DNA language model: follow their repos' install steps
