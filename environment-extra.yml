# Extra environment for the shape checks and figures (scripts 23 and 24), kept separate so the
# main analysis environment (environment.yml) stays exactly as it was when scripts 12-22 ran.
# After creating it: pip install --no-deps -e .
name: rnalm-extra
channels:
  - conda-forge
dependencies:
  - python=3.11.18
  - r-base=4.5.3
  - r-lme4=2.0_6
  - r-mgcv=1.9_4
  - r-glmmtmb=1.1.14
  - r-jsonlite=2.0.0
  - scikit-learn=1.9.1
  - numpy=2.4.6
  - pandas=3.1.1
  - joblib=1.6.0
  - scipy
  - matplotlib
  - pyyaml
