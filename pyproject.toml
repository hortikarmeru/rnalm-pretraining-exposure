[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rnalm-exposure"
version = "0.1.0"
description = "Pretraining exposure and zero-shot RNA secondary structure accuracy in RNA language models"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Meru Hortikar" }]
requires-python = ">=3.11"
dependencies = ["pyyaml", "numpy", "pandas"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
